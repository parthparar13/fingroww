<!-- FinGrow PWA progress backup tools -->
<div id="fgBackupTools" style="position:fixed;right:10px;top:68px;z-index:8;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 20px)">
  <button type="button" id="fgExportProgress" style="background:#1c3949;color:#e9f8ff;border:1px solid #3a6172;border-radius:9px;padding:7px 10px;font:600 12px system-ui">Export progress</button>
  <label for="fgImportFile" style="background:#1c3949;color:#e9f8ff;border:1px solid #3a6172;border-radius:9px;padding:7px 10px;font:600 12px system-ui;cursor:pointer">Import progress</label>
  <input id="fgImportFile" type="file" accept="application/json,.json" style="display:none">
</div>
<div id="fgBackupMessage" role="status" style="display:none;position:fixed;right:10px;top:110px;z-index:9;max-width:calc(100vw - 20px);background:#102333;color:#f4faff;border:1px solid #50e3a4;border-radius:10px;padding:10px 13px;font:13px system-ui"></div>
<script>
(function () {
  const exportButton = document.getElementById("fgExportProgress");
  const importInput = document.getElementById("fgImportFile");
  const message = document.getElementById("fgBackupMessage");
  function tell(text) {
    message.textContent = text;
    message.style.display = "block";
    setTimeout(() => { message.style.display = "none"; }, 6500);
  }
  exportButton.addEventListener("click", function () {
    try {
      const keys = ["fingrow-demo-v5", "fingrow-demo-v4", "fingrow-demo-v3", "fingrow-demo-v2"];
      let payload = null, sourceKey = "";
      for (const key of keys) {
        const raw = localStorage.getItem(key);
        if (raw) {
          try { payload = JSON.parse(raw); sourceKey = key; break; } catch (_) {}
        }
      }
      if (!payload) {
        tell("No saved FinGrow progress was found in this browser.");
        return;
      }
      const blob = new Blob([JSON.stringify({app:"FinGrow",backupVersion:1,sourceKey,exportedAt:new Date().toISOString(),state:payload}, null, 2)], {type:"application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "FinGrow-progress-backup.json"; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      tell("Progress backup downloaded. Keep this file safe until your PWA is set up.");
    } catch (e) {
      tell("Could not export progress in this browser.");
    }
  });
  importInput.addEventListener("change", async function () {
    const file = importInput.files && importInput.files[0];
    if (!file) return;
    try {
      const data = JSON.parse(await file.text());
      const state = data && data.app === "FinGrow" && data.state && typeof data.state === "object" ? data.state : data;
      if (!state || typeof state !== "object" || !Array.isArray(state.done) || typeof state.coins !== "number") {
        tell("That file doesn't look like a valid FinGrow progress backup.");
        return;
      }
      if (!confirm("Import this FinGrow progress? It will replace the progress currently saved in this browser.")) return;
      localStorage.setItem("fingrow-demo-v5", JSON.stringify(state));
      tell("Progress imported. Reloading FinGrow…");
      setTimeout(() => location.reload(), 900);
    } catch (e) {
      tell("Could not read that backup file. Please select a valid FinGrow JSON backup.");
    } finally {
      importInput.value = "";
    }
  });
})();
</script>

function startQuiz(group){currentQuiz={group,index:0,correct:0,chosen:null};showQuiz()}function showQuiz(){let q=currentQuiz,items=questionBank[q.group];if(q.index>=items.length){let best=Math.max(state.quizzes[q.group]||0,q.correct);state.quizzes[q.group]=best;let score=q.correct;let baseXP=score*10;let xpEarned=score===15?baseXP*2:baseXP;let coinsEarned=score*5;state.xp+=xpEarned;state.coins+=coinsEarned;currentQuiz=null;save();modal(`<div class="eyebrow">Quiz completed</div><h2>${score}/15 correct 🎉</h2><p>Earned ${xpEarned} XP${score===15?' (perfect score: XP doubled!)':''} and ${coinsEarned} FinCoins.</p><p class="hint">FinCoins are never doubled. You can review lessons and retry the quiz.</p>`);return}let item=items[q.index];modal(`<div class="eyebrow">${esc(q.group)} · Question ${q.index+1}/15</div><h2>${esc(item[0])}</h2>${item[1].map((o,i)=>`<button class="option ${q.chosen===i?'chosen':''}" onclick="answerQuiz(${i})">${esc(o)}</button>`).join('')}${q.chosen===null?'':`<p class="${q.chosen===item[2]?'tag':'muted'}">${q.chosen===item[2]?'Correct!':'Correct answer: '+esc(item[1][item[2]])}</p>${btn('Next →','nextQuiz()')}`}`)}function answerQuiz(i){if(currentQuiz.chosen!==null)return;currentQuiz.chosen=i;state.quizAttempts=(state.quizAttempts||0)+1;if(i===questionBank[currentQuiz.group][currentQuiz.index][2]){currentQuiz.correct++;state.quizCorrect=(state.quizCorrect||0)+1}showQuiz()}function nextQuiz(){currentQuiz.index++;currentQuiz.chosen=null;showQuiz()}
function tools(){return `<section class="hero"><div class="eyebrow">Practical tools</div><h1>Try the numbers.</h1><p>Explore budgets, savings growth and loan instalments with adjustable assumptions. Examples are illustrative, not financial advice.</p></section><div class="grid two">${card(`<h3>💳 Monthly budget</h3><div class="field">Income (₹)<input id="budgetIncome" type="number" min="0" value="15000"></div><div class="field">Essentials (₹)<input id="budgetEssential" type="number" min="0" value="12000"></div><div class="field">Other spending (₹)<input id="budgetOther" type="number" min="0" value="1000"></div>${btn('Calculate budget','calcBudget()')}<div id="budgetResult" class="notice">Example: prioritise essentials before optional spending.</div>`)}${card(`<h3>📈 Savings growth</h3><div class="field">Starting amount (₹)<input id="growPrincipal" type="number" min="0" value="10000"></div><div class="field">Monthly contribution (₹)<input id="growMonthly" type="number" min="0" value="500"></div><div class="field">Assumed annual rate (%)<input id="growRate" type="number" min="0" max="30" value="6"></div><div class="field">Years<input id="growYears" type="number" min="1" max="50" value="5"></div>${btn('Calculate growth','calcGrowth()')}<div id="growResult" class="notice">Assumed growth is not guaranteed.</div>`)}${card(`<h3>🏦 Loan EMI</h3><div class="field">Loan amount (₹)<input id="loanAmount" type="number" min="0" value="100000"></div><div class="field">Annual interest (%)<input id="loanRate" type="number" min="0" max="100" value="12"></div><div class="field">Tenure (months)<input id="loanMonths" type="number" min="1" max="600" value="24"></div>${btn('Calculate EMI','calcEMI()')}<div id="loanResult" class="notice">Review total repayment, not just monthly EMI.</div>`)}${card(`<h3>🛡️ Safety challenge</h3><p>You receive a message: “Your bank account will be blocked in 10 minutes. Click here and share your OTP.”</p>${btn('What should I do?','safetyTip()','btn alt')}<p class="hint">Practice identifying urgent scam messages.</p>`)}</div>`}
const num=id=>Number($(id).value),money=n=>'₹'+Math.round(n).toLocaleString('en-IN');function calcBudget(){let i=num('budgetIncome'),e=num('budgetEssential'),o=num('budgetOther');if([i,e,o].some(x=>!Number.isFinite(x)||x<0))return;$('budgetResult').innerHTML=`<strong>Remaining: ${money(i-e-o)}</strong><p>${i-e-o<0?'Expenses exceed income. Review costs and seek support where needed.':'This is what remains after the entered expenses; saving is optional and depends on real needs.'}</p>`}function calcGrowth(){let p=num('growPrincipal'),m=num('growMonthly'),r=num('growRate')/1200,y=num('growYears');if(p<0||m<0||r<0||y<1||y>50)return;let balance=p;for(let i=0;i<y*12;i++)balance=balance*(1+r)+m;$('growResult').innerHTML=`<strong>Illustrative final value: ${money(balance)}</strong><p>Contributions: ${money(p+m*y*12)}. Actual returns can vary or be negative.</p>`}function calcEMI(){let p=num('loanAmount'),r=num('loanRate')/1200,n=num('loanMonths');if(p<0||r<0||n<1||n>600)return;let emi=r===0?p/n:p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1);$('loanResult').innerHTML=`<strong>Monthly EMI: ${money(emi)}</strong><p>Total repayment: ${money(emi*n)} · Interest: ${money(emi*n-p)}. Excludes fees and other charges.</p>`}function safetyTip(){modal('<h2>🛡️ Stop and verify</h2><p>Do not click the link or share an OTP. Open your bank’s official app or contact it through a verified number. Scammers often create false urgency.</p>')}
const salaries={Intern:50,'Junior Developer':100,'Financial Analyst':175,Manager:275,Entrepreneur:400};function world(){let sal=salaries[state.career];return `<section class="hero"><div class="eyebrow">The FinGrow Money World</div><h1>Make choices. See consequences.</h1><p>A safe simulation where FinCoins represent virtual money. Learn that spending, saving and unexpected costs affect what remains.</p></section><div class="grid">${card(`<div class="muted">Cash balance</div><div class="stat">${state.coins} 🪙</div>`)}${card(`<div class="muted">Virtual investment</div><div class="stat">${state.investment} 🪙</div>`)}${card(`<div class="muted">Month</div><div class="stat">${state.month}</div>`)}</div><h2>Career & monthly choices</h2>${card(`<div class="grid two"><div><h3>💼 Your career</h3><div class="field"><label>Choose a role</label><select id="career" onchange="setCareer(this.value)">${Object.keys(salaries).map((c,i)=>{const path=['Intern','Junior Developer','Financial Analyst','Manager','Entrepreneur'];const current=path.indexOf(state.career);const locked=(c!==state.career && (i!==current+1 || state.careerMonths<2 || (c==='Entrepreneur'&&!state.company)));return `<option value="${c}" ${state.career===c?'selected':''} ${locked?'disabled':''}>${c}${locked?' · locked':''}</option>`}).join('')}</select></div><p class="muted">Virtual salary: <strong>${sal} FinCoins/month</strong></p><p class="hint">Career stages: spend 2 completed months in each role before promotion: Intern → Junior Developer → Financial Analyst → Manager → Entrepreneur. Entrepreneur also requires a company funded with 5,000 FinCoins. Salaries are game values, not real-world wages.</p></div><div><h3>🛒 Monthly expenses</h3><div class="field"><label>Planned expenses (FinCoins)</label><input id="expenses" type="number" min="0" max="10000" value="${state.monthExpense??30}" ${state.monthDone?'disabled':''}></div><p class="hint">Think about rent, food, travel and unexpected needs.</p></div></div><div class="actions">${btn(state.monthDone?'Month completed ✓':'Complete month', 'finishMonth()', 'btn')}${btn('Make financial decision','worldDecision()','btn alt')}${btn('Next month →','nextMonth()','btn alt')}</div><p class="hint">Complete the month → make a decision → move to next month.</p>`)}<h2>Build your financial future</h2><div class="grid two">${card(`<h3>🏦 Savings pocket</h3><p>Cash saved: <strong>${state.savings} FinCoins</strong>. Move money between your cash and savings without real-world transactions.</p>${btn('Manage savings','savingsModal()','btn alt')}`)}${card(`<h3>🏢 Your company</h3><p>${state.company?'You own a virtual company. Manage your money carefully as it grows.':'Starting a company requires 5,000 FinCoins in virtual startup capital.'}</p>${btn(state.company?'Company details':'Start a company · 5,000 🪙','companyModal()','btn alt')}`)}${card(`<h3>🛍️ FinGrow marketplace</h3><p>Buy virtual items, track what you own and practise resale decisions.</p>${btn('Open marketplace','marketModal()','btn alt')}`)}${card(`<h3>📈 Virtual investment</h3><p>Explore risk with a fixed illustrative example. Investing is optional.</p>${btn('Explore simulation','investModal()','btn alt')}`)}${card(`<h3>🧯 Unexpected expenses</h3><p>What happens if an urgent cost arrives?</p>${btn('Try an emergency','emergency()','btn alt')}`)}</div><h2>Your activity</h2>${card(state.history.length?state.history.slice(-7).reverse().map(h=>`<div class="lesson"><span>${esc(h)}</span></div>`).join(''):'<p class="muted">Complete a month to see your history.</p>')}<div class="notice">This is a simplified teaching simulation. There are no deposits, withdrawals, bank connections, guaranteed investment returns or real transactions.</div>`}function setCareer(c){const path=['Intern','Junior Developer','Financial Analyst','Manager','Entrepreneur'];const current=path.indexOf(state.career),target=path.indexOf(c);if(c==='Entrepreneur'&&!state.company){modal('<h2>Startup capital required</h2><p>The Entrepreneur route requires you to create a company with 5,000 FinCoins in startup capital first.</p>');render();return}if(target!==current+1||state.careerMonths<2){modal(`<h2>Career stage locked</h2><p>Stay in ${esc(state.career)} for at least two completed months before moving to the next career stage. Career stages must be completed in order.</p>`);render();return}if(state.monthDone){modal('<h2>Finish this month first</h2><p>Move to the next month before changing careers.</p>');return}state.career=c;state.careerMonths=0;state.history.push(`Promoted to ${c}`);save()}function finishMonth(){if(state.monthDone)return;let e=num('expenses');if(!Number.isFinite(e)||e<0||e>10000){modal('<h2>Check expenses</h2><p>Enter an amount between 0 and 10,000 FinCoins.</p>');return}state.monthExpense=e;let sal=salaries[state.career];state.coins+=sal-e;state.earned+=sal;state.spent+=e;state.monthDone=true;state.decision=false;state.monthsWorked++;state.careerMonths=(state.careerMonths||0)+1;state.history.push(`Month ${state.month}: earned ${sal}, spent ${e}, net ${sal-e>=0?'+':''}${sal-e} FinCoins`);save();modal(`<h2>📅 Month completed</h2><p>Salary: +${sal} 🪙<br>Expenses: −${e} 🪙<br><strong>Monthly change: ${sal-e>=0?'+':''}${sal-e} 🪙</strong></p><p>${sal-e<0?'Your expenses exceeded salary. Consider priorities and avoid unnecessary debt.':'Now decide what to do with what remains.'}</p>`)}function worldDecision(){if(!state.monthDone){modal('<h2>Complete your month</h2><p>Earn salary and pay expenses first.</p>');return}if(state.decision){modal('<h2>Decision recorded</h2><p>Move to the next month to make another decision.</p>');return}modal(`<h2>🧠 Financial decision</h2><p>Your virtual cash balance is <strong>${state.coins} FinCoins</strong>. What would you do next?</p><div class="actions">${btn('Keep funds for emergencies',"chooseDecision('Keep funds for emergencies')")}${btn('Spend 20 FinCoins',"chooseDecision('Spend 20 FinCoins')",'btn alt')}${btn('Review priorities',"chooseDecision('Review priorities')",'btn alt')}</div><p class="hint">No single choice fits every household.</p>`)}function chooseDecision(choice){if(choice==='Spend 20 FinCoins'){if(state.coins<20){modal('<h2>Not enough cash</h2><p>You cannot spend 20 FinCoins without enough funds. Consider essentials first.</p>');return}state.coins-=20;state.spent+=20}state.decision=true;state.history.push(`Month ${state.month}: ${choice}`);closeModal();save()}function nextMonth(){if(!state.monthDone||!state.decision){modal('<h2>Finish the steps</h2><p>Complete the current month and record a financial decision first.</p>');return}state.month++;state.monthDone=false;state.decision=false;save()}function savingsModal(){modal(`<h2>🏦 Savings pocket</h2><p>Cash: <strong>${state.coins} 🪙</strong> · Savings: <strong>${state.savings||0} 🪙</strong></p><div class="field"><label>Amount (FinCoins)</label><input id="savingsAmount" type="number" min="1" step="1" value="25"></div><div class="actions">${btn('Deposit into savings','depositSavings()')}${btn('Withdraw to cash','withdrawSavings()','btn alt')}</div><p class="hint">This is a simple virtual savings feature. No interest is added automatically.</p>`)}function depositSavings(){let a=Number($('savingsAmount')?.value);if(!Number.isInteger(a)||a<=0||a>state.coins){modal('<h2>Check amount</h2><p>Enter a whole-number amount above zero that does not exceed your cash balance.</p>');return}state.coins-=a;state.savings=(state.savings||0)+a;state.history.push(`Moved ${a} FinCoins from cash to savings`);save();modal(`<h2>Deposit complete ✓</h2><p>${a} FinCoins moved to savings.</p>`)}function withdrawSavings(){let a=Number($('savingsAmount')?.value);if(!Number.isInteger(a)||a<=0||a>(state.savings||0)){modal('<h2>Check amount</h2><p>Enter a whole-number amount that does not exceed your savings balance.</p>');return}state.savings-=a;state.coins+=a;state.history.push(`Withdrew ${a} FinCoins from savings to cash`);save();modal(`<h2>Withdrawal complete ✓</h2><p>${a} FinCoins moved to cash.</p>`)}function companyModal(){if(state.company){modal(`<h2>🏢 Your company</h2><p>You have a virtual company. Startup capital is already paid.</p><p>Cash balance: ${state.coins} FinCoins · Savings: ${state.savings||0} FinCoins</p><p class="hint">This prototype records company ownership but does not simulate real business registration or guaranteed profits.</p>`);return}modal(`<h2>🏢 Start your own company?</h2><p>Startup capital required: <strong>5,000 FinCoins</strong>.</p><p>Your virtual cash balance: <strong>${state.coins} FinCoins</strong>.</p>${state.coins>=5000?btn('Pay 5,000 and create company','createCompany()'): '<div class="notice">You need '+(5000-state.coins)+' more FinCoins before you can start a company. Build your balance through lessons and Money World activities.</div>'}`)}function createCompany(){if(state.company)return;if(state.coins<5000){companyModal();return}state.coins-=5000;state.company=true;state.history.push('Created a virtual company using 5,000 FinCoins startup capital');save();modal('<h2>🎉 Company created!</h2><p>Your virtual company is now registered in this learning simulation. Remember to keep enough money for essential costs.</p>')}function marketModal(){const items=[['Notebook',15],['Headphones',60],['Bicycle',120]];const owned=state.marketItems||{};modal(`<h2>🛍️ FinGrow marketplace</h2><p>Cash available: <strong>${state.coins} FinCoins</strong></p><p class="hint">Virtual items only. Resale prices are lower than purchase prices, showing that purchases may lose value.</p>${items.map(([name,cost])=>`<div class="lesson"><div><strong>${name}</strong><small>Buy: ${cost} 🪙 · Resale: ${Math.floor(cost/2)} 🪙 · Owned: ${owned[name]||0}</small></div><div class="actions">${btn('Buy',`buyItem('${name}',${cost})`,'btn small')}${btn('Sell',`sellItem('${name}',${cost})`,'btn alt small')}</div></div>`).join('')}`)}function buyItem(name,cost){if(state.coins<cost){modal('<h2>Not enough FinCoins</h2><p>You do not have enough cash for this item. Consider whether it is a need or a want.</p>');return}state.coins-=cost;state.marketItems=state.marketItems||{};state.marketItems[name]=(state.marketItems[name]||0)+1;state.history.push(`Bought ${name} for ${cost} FinCoins`);save();marketModal()}function sellItem(name,cost){state.marketItems=state.marketItems||{};if(!state.marketItems[name]){modal('<h2>No item to sell</h2><p>You need to own an item before selling it.</p>');return}state.marketItems[name]-=1;state.coins+=Math.floor(cost/2);state.history.push(`Sold ${name} for ${Math.floor(cost/2)} FinCoins`);save();marketModal()}function investModal(){modal(`<h2>📈 Virtual investment</h2><p>Buy a virtual holding, simulate a market movement, and sell at its current value. The price can rise or fall and gains are not guaranteed.</p><p>Cash available: <strong>${state.coins} FinCoins</strong></p><p>Amount invested: <strong>${state.investment} FinCoins</strong> · Current value: <strong>${Math.round(state.investmentValue||state.investment)} FinCoins</strong></p><div class="actions">${btn('Buy 50 FinCoins of investment','investNow()')}${btn('Simulate market movement','marketMovement()','btn alt')}${btn('Sell 50 FinCoins of investment','sellInvestment()','btn alt')}</div><p class="hint">Real investments can rise or fall and may lose money. This practice feature does not connect to markets.</p>`)}function sellInvestment(){if(state.investment<50){modal('<h2>Not enough investment units</h2><p>You need at least 50 FinCoins of invested principal to sell this portion.</p>');return}const current=Number(state.investmentValue||state.investment);const proceeds=Math.round(current*(50/state.investment));state.investment-=50;state.investmentValue=Math.max(0,current-proceeds);state.coins+=proceeds;state.history.push(`Sold 50 FinCoins of investment principal for ${proceeds} FinCoins at current simulated value`);save();investModal()}function investNow(){if(state.coins<50){modal('<h2>Insufficient FinCoins</h2><p>Build your virtual balance first. Investing is never required.</p>');return}state.coins-=50;state.investment+=50;state.investmentValue=Number(state.investmentValue||0)+50;state.history.push('Bought 50 FinCoins of virtual investment');save();investModal()}function marketMovement(){if(!state.investment){modal('<h2>No investment yet</h2><p>Buy a virtual investment holding first, then simulate market movement.</p>');return}const old=Number(state.investmentValue||state.investment);const pct=(Math.random()*0.30)-0.15;state.investmentValue=Math.max(0,Math.round(old*(1+pct)));const change=state.investmentValue-old;state.history.push(`Virtual market moved ${change>=0?'+':''}${change} FinCoins (${Math.round(pct*100)}%)`);save();investModal()}function emergency(){let cost=35;if(state.coins<cost){modal('<h2>Not enough cash</h2><p>This emergency costs 35 FinCoins in the simulation. Build your balance first, or use it as a discussion scenario without applying the cost.</p>');return}state.coins-=cost;state.history.push(`Unexpected essential expense: −${cost} FinCoins`);save();modal(`<h2>🧯 Emergency event</h2><p>An unexpected essential cost of ${cost} FinCoins occurred. ${state.coins<0?'Your balance is negative. This demonstrates why emergency planning matters, while recognising not everyone can afford to save.':'You covered the cost using your virtual balance.'}</p>`)}

'Needs vs Wants':`Learn the important difference between things you genuinely need and things you simply want. Explore how everyday spending choices affect your budget and discover how identifying your priorities can help you make more thoughtful financial decisions.`,
'Compound Interest':`Discover how money can grow over time through compound interest. Learn how interest can be added to your existing balance, how your earnings can generate further earnings, and why starting early can make a significant difference over longer periods.`,
'Income & Expenses':`Income is the money you receive, such as money from a job, allowance, or other sources.\n\nExpenses are the amounts you spend on things like food, transportation, bills, and other needs.\n\nUnderstanding your income and expenses helps you see where your money goes. It also makes it easier to plan a budget and decide how much you can save.\n\nA simple habit is to keep track of the money you receive and the money you spend. This can help you identify unnecessary spending and make better financial decisions.`,
'Emergency Funds':`An emergency fund is money kept aside for unexpected expenses or difficult situations.\n\nIt can help when something unexpected happens, such as an important repair, sudden expense, or temporary loss of income. Having money set aside means you may not have to depend immediately on borrowing.\n\nA good emergency fund should be kept somewhere safe and easily accessible. The amount you need can depend on your situation and regular expenses.\n\nBuilding an emergency fund takes time. You can start by saving small amounts regularly and gradually increase your savings.\n\nThe main purpose of an emergency fund is to provide financial security when unexpected expenses arise.`,
'Bank Accounts':`A bank account is a place where you can safely keep and manage your money.\n\nCommon types of bank accounts include savings accounts and current accounts. A savings account is generally used to keep money and may earn interest over time.\n\nBank accounts also make it easier to receive money, make payments, transfer funds, and keep track of transactions.\n\nBanks provide statements or transaction records so you can see money coming into and going out of your account.`,
'Debit & Credit Cards':`Debit and credit cards are both used to make payments, but they work differently.\n\nA debit card usually uses money directly from your bank account. When you make a purchase, the amount is generally deducted from your available balance.\n\nA credit card allows you to borrow money from the card issuer up to a certain limit and repay it later.\n\nCredit cards can be useful when managed responsibly, but failing to repay amounts on time can result in interest and other charges.`,
'Interest & Bank Deposits':`Interest is the amount paid or charged for the use of money.\n\nWhen you keep money in certain bank deposits, the bank may pay you interest. The amount of interest can depend on the type of deposit, the interest rate, and the time for which the money is kept.\n\nFor example, if a bank pays interest on your savings, your money can gradually increase over time.\n\nDifferent bank products can have different interest rates and conditions, so it is important to understand them before using one.`,
'Loans & EMIs':`A loan is money borrowed from a bank or another financial institution that is repaid over time.\n\nLoans usually involve interest, which means the total amount repaid can be greater than the amount originally borrowed.\n\nEMI stands for Equated Monthly Instalment. It is a fixed or scheduled amount paid regularly towards certain loans.\n\nAn EMI can include both part of the borrowed amount and interest. The amount and duration of an EMI depend on factors such as the loan amount, interest rate, and repayment period.`,
'Banking Safety':`Banking safety means protecting your money and account information from unauthorised access.\n\nNever share sensitive information such as your PIN, password, or OTP with other people. Banks and legitimate payment services generally do not need you to reveal such confidential information through unexpected calls or messages.\n\nBe careful when clicking links in messages or emails, especially when they ask for banking or payment details.\n\nUsing strong passwords, keeping your phone secure, and checking transactions regularly can help keep your banking information safer.`,
'Investing Basics':`Investing means putting money into an asset with the goal of growing its value or earning income over time.\n\nPeople invest for different long-term goals, such as building wealth or preparing for future needs.\n\nInvestments can include things such as stocks, bonds, mutual funds, and ETFs.\n\nInvesting is different from saving because investments can increase or decrease in value. The potential for higher returns usually comes with some level of risk.\n\nBefore investing, it is important to understand how the investment works and the risks involved.`,
'Stocks':`A stock represents a small ownership share in a company.\n\nWhen someone owns a stock, they own a small part of that company. The value of a stock can rise or fall depending on many factors, including the company's performance and market conditions.\n\nSome companies may also pay dividends to shareholders.\n\nStocks can provide opportunities for growth, but their prices can also change significantly. This means investing in stocks involves risk.`,
'Mutual Funds':`A mutual fund is an investment where money from many investors is pooled together.\n\nThe pooled money is used to invest in a collection of assets, such as stocks, bonds, or other securities.\n\nA professional fund manager generally manages the investments according to the fund's objectives.\n\nBecause a mutual fund can hold many different investments, it can provide diversification. However, mutual funds can still lose value and are not guaranteed to make a profit.`,
'ETFs':`ETF stands for Exchange-Traded Fund.\n\nAn ETF is a fund that holds a collection of assets and can be bought and sold on a stock exchange during market hours.\n\nAn ETF may track an index, a group of companies, a particular sector, or another collection of assets.\n\nETFs can provide diversification because one ETF may contain many different investments.\n\nLike other investments, ETFs can rise or fall in value and involve risk.`,
'Risk & Diversification':`Investment risk is the possibility that an investment may lose some or all of its value.\n\nDifferent investments have different levels and types of risk. Generally, investments with greater potential returns can also involve greater risk.\n\nDiversification means spreading money across different investments instead of putting everything into one investment.\n\nFor example, owning different types of assets can reduce the impact of one investment performing poorly.\n\nDiversification cannot remove all risk, but it can help reduce the effect of problems affecting a single investment.`,
'Scams & Fraud':`Financial scams are attempts to trick people into giving away money, personal information, or access to their accounts.\n\nScammers may pretend to be banks, companies, government organisations, or even people you know. They may create a sense of urgency to make you act without thinking.\n\nCommon warning signs include unexpected requests for money, unusual payment requests, promises of easy money, and requests for confidential information.\n\nBefore making a payment or sharing information, verify who you are dealing with and think carefully about the request.`,
'Digital Payment Safety':`Digital payments allow people to transfer money quickly using methods such as UPI, cards, and online banking.\n\nWhile digital payments are convenient, they should be used carefully. Always check the recipient's details and the amount before confirming a payment.\n\nAvoid making payments through suspicious links or unknown apps. Keep your phone, payment apps, and banking applications protected with appropriate security measures.\n\nRegularly checking your transaction history can also help you notice unfamiliar payments quickly.`,
'Passwords & OTPs':`Passwords and OTPs help protect your accounts and financial information.\n\nA password should be difficult for others to guess and should not be shared with other people. Using different passwords for important accounts can provide additional protection.\n\nAn OTP, or One-Time Password, is a temporary code used to verify certain actions or transactions.\n\nNever share your OTP, PIN, or password with someone who asks for it unexpectedly. Keeping these details private is an important part of financial safety.`,
'Phishing':`Phishing is a type of scam where someone tries to trick you into revealing information such as passwords, card details, or account information.\n\nPhishing attempts can arrive through emails, text messages, social media, or fake websites. They may look like messages from legitimate organisations.\n\nWarning signs can include suspicious links, unusual requests, spelling mistakes, or messages that create unnecessary urgency.\n\nBefore clicking a link or providing information, check the source carefully and use the organisation's official website or app when possible.`,
'Safe Financial Decisions':`Safe financial decisions involve thinking carefully before spending, sharing information, or making financial commitments.\n\nBefore making a payment or signing up for a financial service, understand what you are agreeing to, including any fees, charges, or conditions.\n\nBe cautious of offers that promise unusually high returns with little or no risk. Take time to verify important information instead of making decisions under pressure.\n\nKeeping records, asking questions, and checking reliable information can help you make more informed financial decisions.`,
'Taxes Basics':`Taxes are amounts of money collected by governments from individuals and businesses.\n\nGovernments use tax revenue to help pay for public services and infrastructure, such as roads, schools, healthcare, and other public facilities.\n\nThere are different types of taxes, and the rules can vary depending on the country and the type of income or purchase involved.\n\nUnderstanding the basic purpose of taxes helps you understand how money moves between people, businesses, and the government.`,
'GST':`GST stands for Goods and Services Tax.\n\nIt is an indirect tax charged on many goods and services. Instead of being paid directly by the final consumer to the government in the same way as income tax, GST is generally collected through businesses as part of the supply of goods and services.\n\nGST was introduced in India to combine several indirect taxes into a more unified tax system.\n\nThe GST rate can differ depending on the type of goods or services involved.`,
'Income Tax':`Income tax is a tax charged on certain types of income according to the applicable tax rules.\n\nFor individuals, taxable income can come from sources such as employment, business activities, or certain other sources.\n\nThe amount of income tax a person may have to pay depends on factors such as their taxable income and the tax rules applicable to them.\n\nIncome tax is different from GST because income tax is generally related to income, while GST is a tax on the supply of many goods and services.`,
'Insurance Basics':`Insurance is a financial arrangement that can help protect against certain risks.\n\nA person or organisation pays an insurance company according to the terms of a policy. In return, the insurer may provide financial support when a covered event occurs.\n\nDifferent types of insurance can cover different risks, such as health, vehicles, property, or other areas.\n\nInsurance does not prevent an unexpected event from happening, but it can help reduce the financial impact of certain covered events.`,
'Premiums & Claims':`A premium is the amount paid to an insurance company to maintain an insurance policy.\n\nThe premium can depend on factors such as the type of insurance, the coverage provided, and the terms of the policy.\n\nA claim is a request made to the insurance company for payment or support when a covered event occurs.\n\nBefore buying insurance, it is important to understand what is covered, what is not covered, and the conditions for making a claim.`,
'Financial Goals':`A financial goal is something you plan to achieve with your money.\n\nGoals can be short-term, such as saving for a small purchase, or long-term, such as saving for education or another major expense.\n\nA useful financial goal should be clear and realistic. Knowing how much money you need and when you need it can make the goal easier to plan.\n\nBreaking a large goal into smaller steps can also make it easier to track your progress.\n\nSetting financial goals helps you give your money a purpose instead of spending without a plan.`,
'Smart Shopping':`Smart shopping means making thoughtful decisions before spending money.\n\nBefore buying something, compare prices, check the quality, and consider whether you actually need or want the item.\n\nA lower price does not always mean a better deal. Factors such as quality, durability, warranty, and additional costs can also matter.\n\nIt can also be useful to check whether discounts are genuine rather than buying something simply because it is on sale.\n\nTaking a little time before purchasing can help reduce unnecessary spending.`,
'Bills & Subscriptions':`Bills are payments for services or expenses that need to be paid regularly or when they become due.\n\nSubscriptions are recurring payments for services such as streaming platforms, apps, memberships, or other services.\n\nSmall recurring payments can add up over time, especially when several subscriptions are active.\n\nKeeping track of payment dates and reviewing subscriptions regularly can help prevent missed payments and unnecessary spending.\n\nIt is also useful to understand the price, renewal terms, and cancellation conditions before subscribing to a service.`,
'Planning Big Purchases':`A big purchase is something that costs a significant amount of money compared with your usual spending.\n\nPlanning before making a large purchase can help you decide whether you can afford it without putting unnecessary pressure on your finances.\n\nYou can compare different options, research prices, consider additional costs, and decide how much you need to save.\n\nFor a planned purchase, setting aside money regularly can make it easier to reach the required amount.\n\nTaking time to plan can also reduce the chance of making an impulsive decision.`,
'Building Good Money Habits':`Good money habits are small actions that help you manage money more effectively over time.\n\nExamples include tracking spending, saving regularly, comparing prices, reviewing subscriptions, and planning purchases.\n\nGood habits do not require making perfect decisions every time. Consistency is more important than trying to change everything at once.\n\nRegularly checking your spending and savings can help you understand your progress and identify areas that need improvement.\n\nBuilding these habits early can make managing money easier as your financial responsibilities grow.`

Object.keys(lessonDescriptionsV2).forEach(k=>{lessonInfo[k]=[lessonDescriptionsV2[k], 'Think about how this concept can guide a real-life financial decision.']});
function openLesson(name){const desc=lessonDescriptionsV2[name]||lessonInfo[name]?.[0]||'';state.lessonViews=state.lessonViews||{};state.lessonViews[name]=(state.lessonViews[name]||0)+1;modal(`<div class="eyebrow">FinGrow lesson</div><h2>${esc(name)}</h2><p style="white-space:pre-line">${esc(desc)}</p><div class="notice">${esc(lessonInfo[name]?.[1]||'Use this idea when making everyday financial decisions.')}</div><h4>Think about it</h4><p class="muted">Where could you use this idea in an everyday financial decision?</p>${btn(state.done.includes(name)?'Already completed ✓':'Mark lesson complete · +10 XP',`completeLesson(${JSON.stringify(name)})`, 'btn')}`)}
function completeLesson(n){if(!state.done.includes(n)){state.done.push(n);state.xp+=10;state.history.push(`Completed lesson: ${n} (+10 XP)`);if(state.done.length===30&&!state.completionBonus){state.completionBonus=true;state.coins+=500;state.xp+=1000;save();modal('<div class="eyebrow">All lessons completed</div><h2>🏆 FinGrow Master!</h2><p>You completed all 30 lessons. Amazing work!</p><div class="notice"><strong>Rewards unlocked</strong><br>🪙 +500 FinCoins<br>⚡ +1,000 XP</div><p>This one-time completion reward has been added to your profile.</p>');return}}save();modal('<h2>Lesson completed ✓</h2><p>+10 XP added to your progress.</p>')}
function home(){const pct=Math.round(state.done.length/30*100);return `<section class="hero"><div class="eyebrow">Your financial journey</div><h1>${state.name?'Welcome back, '+esc(state.name)+'!':'Build your money skills.'}</h1><p>Small decisions today can build stronger financial habits tomorrow. Learn, test your judgement and track your progress.</p><div class="actions">${btn('Continue learning →',"go('learn')")}${btn('Enter Money World',"go('world')",'btn alt')}</div></section><div class="grid">${card(`<div class="muted">Player level</div><div class="stat">${level()}</div><div class="progress"><div style="width:${(state.xp%150)/1.5}%"></div></div><p class="hint">${state.xp%150}/150 XP to next level</p>`)}${card(`<div class="muted">Learning progress</div><div class="stat">${pct}%</div><div class="progress"><div style="width:${pct}%"></div></div><p class="hint">${state.done.length} of 30 lessons completed</p>`)}${card(`<div class="muted">Your wallet</div><div class="stat">${state.coins} 🪙</div><p class="hint">+ ${state.savings||0} FinCoins in savings</p>`)}</div><h2>🎯 Your active quests</h2>${card(questMarkup())}<h2>📌 Your next best steps</h2><div class="grid two">${card(`<h3>📚 Continue learning</h3><p>Pick up where you left off and unlock category quizzes.</p>${btn('Open lessons',"go('learn')")}`)}${card(`<h3>🌍 Build your Money World</h3><p>Work through career stages, make decisions, invest virtually and build your net worth.</p>${btn('View your world',"go('world')")}`)}</div><div class="notice"><strong>FinGrow principle:</strong> Protect essential needs, understand risks and make deliberate choices. Virtual rewards are for learning—not real money.</div>`}
function questMarkup(){const qs=questList();return qs.map(q=>`<div class="quest"><div style="display:flex;justify-content:space-between;gap:12px"><strong>${q.icon} ${esc(q.title)}</strong><span class="pillTag">${q.done?'Completed':'In progress'}</span></div><p class="hint">${esc(q.desc)}</p><div class="progress"><div style="width:${Math.min(100,q.progress/q.target*100)}%"></div></div><small>${q.progress}/${q.target} · Reward: ${q.reward} 🪙 + ${q.xp} XP</small>${q.done?'':btn('Claim reward',`claimQuest('${q.id}')`,'btn alt small')}</div>`).join('')}
function questList(){const nw=netWorth();return [{id:'wealth1',icon:'🪙',title:'First 1,000 net worth',desc:'Reach 1,000 FinCoins in total net worth.',progress:nw,target:1000,reward:100,xp:30,done:!!state.quests?.wealth1},{id:'level5',icon:'🏆',title:'Level 5 player',desc:'Reach player level 5.',progress:level(),target:5,reward:150,xp:50,done:!!state.quests?.level5},{id:'save500',icon:'🐷',title:'Build a savings habit',desc:'Keep 500 FinCoins in your savings pocket.',progress:state.savings||0,target:500,reward:75,xp:25,done:!!state.quests?.save500},{id:'lessons10',icon:'📚',title:'Curious learner',desc:'Complete 10 lessons.',progress:state.done.length,target:10,reward:50,xp:30,done:!!state.quests?.lessons10},{id:'investgain',icon:'📈',title:'First investment gains',desc:'Earn at least 100 FinCoins in realised or unrealised investment gains.',progress:investmentGain(),target:100,reward:100,xp:40,done:!!state.quests?.investgain}].map(q=>({...q,done:q.done||q.progress>=q.target}))}
function claimQuest(id){const q=questList().find(x=>x.id===id);if(!q||q.progress<q.target||state.quests?.[id]){modal('<h2>Quest not ready</h2><p>Reach the target first. Each quest reward can only be claimed once.</p>');return}state.quests=state.quests||{};state.quests[id]=true;state.coins+=q.reward;state.xp+=q.xp;state.history.push(`Quest completed: ${q.title} (+${q.reward} FinCoins, +${q.xp} XP)`);save();modal(`<h2>🎉 Quest completed!</h2><p>${esc(q.title)}</p><div class="notice">+${q.reward} FinCoins · +${q.xp} XP</div>`)}
function netWorth(){return Number(state.coins||0)+Number(state.savings||0)+Number(state.investmentValue||0)+Object.values(state.investmentAssets||{}).reduce((a,x)=>a+Number(x.value||0),0)+(state.business?Number(state.business.value||0):0)}
function investmentGain(){return Number(state.investmentValue||0)-Number(state.investment||0)+Object.values(state.investmentAssets||{}).reduce((a,x)=>a+Number(x.value||0)-Number(x.principal||0),0)}
function profile(){const total=Number(state.totalSeconds||0)+Math.max(0,Math.floor((Date.now()-(state.sessionStartedAt||Date.now()))/1000));const hrs=Math.floor(total/3600),mins=Math.floor(total%3600/60);const accuracy=state.quizAttempts?Math.round(state.quizCorrect/state.quizAttempts*100):0;const invested=Object.values(state.investmentAssets||{}).reduce((a,x)=>a+Number(x.value||0),0)+Number(state.investmentValue||0);return `<section class="hero"><div class="eyebrow">Player dashboard</div><h1>My FinGrow profile</h1><p>Your learning record, money decisions and progress—all in one place.</p></section>${card(`<div class="grid two"><div class="field"><label>First name or nickname</label><input id="name" maxlength="35" value="${esc(state.name)}" placeholder="Choose a nickname"></div><div class="field"><label>Age range</label><select id="age">${['13–15','16–17','18+'].map(x=>`<option ${state.age===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>I am a...</label><select id="status">${['Student','Working','Other'].map(x=>`<option ${state.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="actions">${btn('Save profile','saveProfile()')}${btn('Reset all demo data','resetDemo()','btn warn')}</div><p class="hint">Profile and progress are stored locally in this browser where local storage is available.</p>`)}<h2>📊 Player stats</h2><div class="grid">${card(`<div class="muted">Time spent</div><div class="stat">${hrs}h ${mins}m</div><p class="hint">Approximate active time in this browser</p>`)}${card(`<div class="muted">Learning progress</div><div class="stat">${state.done.length}/30</div><p class="hint">${Math.round(state.done.length/30*100)}% of lessons completed</p>`)}${card(`<div class="muted">Quiz accuracy</div><div class="stat">${accuracy}%</div><p class="hint">Across tracked quiz answers</p>`)}${card(`<div class="muted">Total XP</div><div class="stat">${state.xp}</div><p class="hint">Level ${level()} · ${state.xp%150}/150 XP to next level</p>`)}${card(`<div class="muted">Net worth</div><div class="stat">${Math.round(netWorth())} 🪙</div><p class="hint">Wallet + savings + investment value + company value</p>`)}${card(`<div class="muted">Investments</div><div class="stat">${Math.round(invested)} 🪙</div><p class="hint">Current simulated value</p>`)}</div><h2>📈 Growth & improvement</h2>${card(`<p>Lesson completion is your clearest learning-progress measure. As you complete more quizzes, FinGrow will track your answer accuracy over time.</p><div class="miniStats"><div class="statTile"><span class="muted">Job experience</span><strong>${state.careerMonths||0} months</strong></div><div class="statTile"><span class="muted">Career</span><strong style="font-size:17px">${esc(state.career)}</strong></div><div class="statTile"><span class="muted">FinCoins earned from salary</span><strong>${state.earned||0}</strong></div><div class="statTile"><span class="muted">FinCoins spent</span><strong>${state.spent||0}</strong></div></div>`)}<p class="hint">Time and quiz stats are tracked only from app activity recorded in this browser; older activity may not have historical detail.</p>`}
function saveProfile(){state.name=$('name').value.trim().slice(0,35);state.age=$('age').value;state.status=$('status').value;save();modal('<h2>Profile saved ✓</h2><p>Your profile and progress have been saved in this browser.</p>')}
function tools(){return `<section class="hero"><div class="eyebrow">Practical tools</div><h1>Try the numbers.</h1><p>Use these calculators to compare choices. Results are estimates, not guarantees.</p></section><div class="grid two">${card(`<h3>💳 Monthly budget</h3><div class="field"><label>Income (₹)</label><input id="budgetIncome" type="number" min="0" value="15000"></div><div class="field"><label>Essentials (₹)</label><input id="budgetEssential" type="number" min="0" value="12000"></div><div class="field"><label>Other spending (₹)</label><input id="budgetOther" type="number" min="0" value="1000"></div>${btn('Calculate budget','calcBudget()')}<div id="budgetResult" class="notice">Plan essentials first.</div>`)}${card(`<h3>📈 Investment growth</h3><div class="field"><label>Starting amount (₹)</label><input id="growPrincipal" type="number" min="0" value="10000"></div><div class="field"><label>Monthly savings (₹)</label><input id="growMonthly" type="number" min="0" value="500"></div><div class="field"><label>Assumed annual growth (%)</label><input id="growRate" type="number" min="0" max="30" value="6"></div><div class="field"><label>Years</label><input id="growYears" type="number" min="1" max="50" value="5"></div>${btn('Calculate growth','calcGrowth()')}<div id="growResult" class="notice">Growth is illustrative and not guaranteed.</div>`)}${card(`<h3>➕ Simple interest</h3><div class="field"><label>Principal (₹)</label><input id="siP" type="number" min="0" value="10000"></div><div class="field"><label>Annual rate (%)</label><input id="siR" type="number" min="0" value="5"></div><div class="field"><label>Time (years)</label><input id="siT" type="number" min="0" value="3"></div>${btn('Calculate interest','calcSimpleInterest()')}<div id="siResult" class="notice">Interest = principal × rate × time.</div>`)}${card(`<h3>🔁 Compound interest</h3><div class="field"><label>Principal (₹)</label><input id="ciP" type="number" min="0" value="10000"></div><div class="field"><label>Annual rate (%)</label><input id="ciR" type="number" min="0" value="6"></div><div class="field"><label>Years</label><input id="ciT" type="number" min="0" value="5"></div>${btn('Calculate compound interest','calcCompoundInterest()')}<div id="ciResult" class="notice">Compounding frequency is annual.</div>`)}${card(`<h3>🏦 Loan EMI</h3><div class="field"><label>Loan amount (₹)</label><input id="loanAmount" type="number" min="0" value="100000"></div><div class="field"><label>Annual interest (%)</label><input id="loanRate" type="number" min="0" max="100" value="12"></div><div class="field"><label>Tenure (months)</label><input id="loanMonths" type="number" min="1" max="600" value="24"></div>${btn('Calculate EMI','calcEMI()')}<div id="loanResult" class="notice">Review total repayment too.</div>`)}${card(`<h3>🎯 Savings goal</h3><div class="field"><label>Target amount (₹)</label><input id="goalTarget" type="number" min="1" value="20000"></div><div class="field"><label>Already saved (₹)</label><input id="goalSaved" type="number" min="0" value="5000"></div><div class="field"><label>Monthly savings (₹)</label><input id="goalMonthly" type="number" min="1" value="1000"></div>${btn('Estimate time','calcSavingsGoal()')}<div id="goalResult" class="notice">Set a realistic target.</div>`)}${card(`<h3>🛒 Inflation calculator</h3><div class="field"><label>Current cost (₹)</label><input id="inflCost" type="number" min="0" value="1000"></div><div class="field"><label>Annual inflation (%)</label><input id="inflRate" type="number" min="0" value="5"></div><div class="field"><label>Years</label><input id="inflYears" type="number" min="0" value="5"></div>${btn('Estimate future cost','calcInflation()')}<div id="inflResult" class="notice">Inflation reduces purchasing power.</div>`)}${card(`<h3>🛡️ Safety challenge</h3><p>You receive a message threatening to block your bank account unless you share an OTP.</p>${btn('What should I do?','safetyTip()','btn alt')}<p class="hint">Never share your OTP. Verify through official channels.</p>`)}</div>`}
function calcSimpleInterest(){let p=num('siP'),r=num('siR'),t=num('siT');$('siResult').textContent=`Interest: ₹${(p*r*t/100).toFixed(2)} · Total: ₹${(p+p*r*t/100).toFixed(2)}`}
function calcCompoundInterest(){let p=num('ciP'),r=num('ciR')/100,t=num('ciT'),total=p*Math.pow(1+r,t);$('ciResult').textContent=`Estimated total: ₹${total.toFixed(2)} · Interest earned: ₹${(total-p).toFixed(2)}`}
function calcSavingsGoal(){let target=num('goalTarget'),saved=num('goalSaved'),monthly=num('goalMonthly'),left=Math.max(0,target-saved);$('goalResult').textContent=left===0?'Goal reached!':`You need ₹${left.toFixed(2)} more. At ₹${monthly.toFixed(2)}/month, about ${Math.ceil(left/monthly)} months.`}
function calcInflation(){let c=num('inflCost'),r=num('inflRate')/100,y=num('inflYears');$('inflResult').textContent=`Estimated future cost: ₹${(c*Math.pow(1+r,y)).toFixed(2)} (increase of ₹${(c*Math.pow(1+r,y)-c).toFixed(2)}).`}

(function normalizeQuizOptions(){
  if(window.__finGrowQuizNormalized) return;

  const fallback=['None of these options','It depends on the situation and the relevant rules','A choice that should be checked carefully','It guarantees the same result every time'];
  Object.values(questionBank||{}).forEach(list=>list.forEach((q,qi)=>{
    if(!Array.isArray(q[1])) q[1]=[];
    while(q[1].length<4){let d=fallback[(qi+q[1].length)%fallback.length];if(q[1].includes(d))d='A different answer that does not fit the situation';q[1].push(d)}
    if(q[1].length>4)q[1]=q[1].slice(0,4);
    // Shuffle the four options once, retaining the correct answer and varying its position.
    const correct=q[1][q[2]];let seed=(qi*7+list.length*3)%4;let rotated=q[1].slice(seed).concat(q[1].slice(0,seed));q[1]=rotated;q[2]=q[1].indexOf(correct);
  }));
})();

home=function(){
 const pct=Math.round(state.done.length/30*100),xpInLevel=Number(state.xp||0)%150;
 return `<section class="hero"><div class="eyebrow">Your financial journey</div><h1>${state.name?'Welcome back, '+esc(state.name)+'!':'Build your money skills.'}</h1><p>Small decisions today can build stronger financial habits tomorrow.</p><div class="levelProgress"><div class="levelRow"><strong>Level ${level()}</strong><span>${xpInLevel}/150 progress</span></div><div class="progress"><div style="width:${xpInLevel/1.5}%"></div></div></div></section><div class="grid">${card(`<div class="muted">Learning progress</div><div class="stat">${pct}%</div><div class="progress"><div style="width:${pct}%"></div></div><p class="hint">${state.done.length} of 30 lessons completed</p>`)}${card(`<div class="muted">FinCoins</div><div class="stat">${state.coins} 🪙</div><p class="hint">Savings pocket: ${state.savings||0} 🪙</p>`)}${card(`<div class="muted">Money World</div><div class="stat">Month ${state.month}</div><p class="hint">${esc(state.career)} · ${state.careerMonths||0} job-months</p>${btn('Enter Money World','go(\'world\')','btn alt')}`)}</div><h2>🎯 Your active quests</h2>${card(questMarkup())}<h2>📌 Your next best steps</h2><div class="grid two">${card(`<h3>📚 Continue learning</h3><p>Pick up where you left off and unlock category quizzes.</p>${btn('Open lessons','go(\'learn\')')}`)}${card(`<h3>🌍 Build your Money World</h3><p>Make financial decisions, grow your career and explore virtual investments.</p>${btn('View your world','go(\'world\')','btn alt')}`)}</div>`;
};
questMarkup=function(){return questList().map(q=>{
 const claimed=!!state.quests?.[q.id],ready=q.progress>=q.target&&!claimed;
 return `<div class="quest"><div class="questHead"><strong>${q.icon} ${esc(q.title)}</strong><span class="pillTag">${claimed?'Reward claimed':ready?'Ready to claim':'In progress'}</span></div><p class="hint">${esc(q.desc)}</p><div class="progress"><div style="width:${Math.min(100,q.progress/q.target*100)}%"></div></div><div class="questBottom"><small>${Math.min(q.progress,q.target)}/${q.target} · Reward: ${q.reward} 🪙</small>${claimed?'<span class="tag">✓ Claimed</span>':ready?btn('Claim reward',`claimQuest('${q.id}')`,'btn alt small'):'<span class="hint">Keep going</span>'}</div></div>`;
}).join('')};
profile=function(){
 const total=Number(state.totalSeconds||0)+Math.max(0,Math.floor((Date.now()-(state.sessionStartedAt||Date.now()))/1000)),hrs=Math.floor(total/3600),mins=Math.floor(total%3600/60),accuracy=state.quizAttempts?Math.round(state.quizCorrect/state.quizAttempts*100):0;
 const invested=Object.values(state.investmentAssets||{}).reduce((a,x)=>a+Number(x.value||0),0)+Number(state.investmentValue||0);
 return `<section class="hero"><div class="eyebrow">Player dashboard</div><h1>My FinGrow profile</h1><p>Your learning record, money decisions and progress.</p></section>${card(`<div class="grid two"><div class="field"><label>First name or nickname</label><input id="name" maxlength="35" value="${esc(state.name)}" placeholder="Choose a nickname"></div><div class="field"><label>Age range</label><select id="age">${['13–15','16–17','18+'].map(x=>`<option ${state.age===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>I am a...</label><select id="status">${['Student','Working','Other'].map(x=>`<option ${state.status===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="actions">${btn('Save profile','saveProfile()')}${btn('Reset all demo data','resetDemo()','btn warn')}</div><p class="hint">Profile and progress are stored in this browser where local storage is available.</p>`)}<h2>📊 Player stats</h2><div class="grid">${card(`<div class="muted">Time spent</div><div class="stat">${hrs}h ${mins}m</div><p class="hint">Approximate active time in this browser</p>`)}${card(`<div class="muted">Lessons completed</div><div class="stat">${state.done.length}/30</div><p class="hint">${Math.round(state.done.length/30*100)}% of lessons completed</p>`)}${card(`<div class="muted">Quiz accuracy</div><div class="stat">${accuracy}%</div><p class="hint">Across tracked quiz answers</p>`)}${card(`<div class="muted">Career</div><div class="stat" style="font-size:22px">${esc(state.career)}</div><p class="hint">${state.careerMonths||0} completed job-months</p>`)}${card(`<div class="muted">Net worth</div><div class="stat">${Math.round(netWorth())} 🪙</div><p class="hint">Wallet + savings + investment value + company value</p>`)}${card(`<div class="muted">FinCoins earned</div><div class="stat">${state.earned||0}</div><p class="hint">From tracked career salary</p>`)}</div><h2>📈 Growth over time</h2>${card(`<p>Your learning progress is tracked from completed lessons and recorded quiz answers.</p><div class="progress"><div style="width:${Math.round(state.done.length/30*100)}%"></div></div><p class="hint">${state.done.length}/30 lessons completed · ${Object.keys(state.quizzes||{}).length}/6 category quizzes attempted</p><div class="miniStats"><div class="statTile"><span class="muted">FinCoins spent</span><strong>${state.spent||0}</strong></div><div class="statTile"><span class="muted">Current investments</span><strong>${Math.round(invested)} 🪙</strong></div></div>`)}`;
};
const careerPathV3=['Intern','Junior Developer','Financial Analyst','Manager','Entrepreneur'];
const careerMonthsRequiredV3={Intern:0,'Junior Developer':5,'Financial Analyst':8,Manager:12,Entrepreneur:15};
const careerFeesV3={'Junior Developer':100,'Financial Analyst':300,Manager:750,Entrepreneur:10000};
world=function(){
 const assets=state.investmentAssets||{},invested=Object.values(assets).reduce((a,x)=>a+Number(x.value||0),0)+Number(state.investmentValue||0),idx=careerPathV3.indexOf(state.career),next=careerPathV3[idx+1],required=next?careerMonthsRequiredV3[next]:0,fee=next?(careerFeesV3[next]||0):0;
 const opts=careerPathV3.map((c,i)=>{const isCurrent=c===state.career,done=i<idx,req=careerMonthsRequiredV3[c]||0,eligible=i===idx+1&&(state.careerMonths||0)>=req&&(state.coins||0)>=fee&&(!state.monthDone)&&(!state.decision);const status=isCurrent?'Current job':done?'Completed stage':i===idx+1?(eligible?'Unlocked':'Locked · '+Math.max(0,req-(state.careerMonths||0))+' more months / '+Math.max(0,fee-state.coins)+' coins'):'Locked · complete earlier stages';return `<option value="${c}" ${isCurrent?'selected':''}>${c} — ${status}</option>`}).join('');
 return `<section class="hero"><div class="eyebrow">Money World</div><h1>Make choices. See consequences.</h1><p>Your virtual life simulation: earn a salary, manage expenses, make a monthly financial decision, and build your net worth. No real money is involved.</p></section><div class="grid">${card(`<div class="muted">Wallet</div><div class="stat">${state.coins} 🪙</div>`)}${card(`<div class="muted">Net worth</div><div class="stat">${Math.round(netWorth())} 🪙</div>`)}${card(`<div class="muted">Current month</div><div class="stat">${state.month}</div><p class="hint">${state.monthDone?(state.decision?'Decision complete':'Awaiting decision'):'Month in progress'}</p>`)}</div><h2>💼 Career progression</h2>${card(`<div class="grid two"><div><h3>${esc(state.career)}</h3><p>Salary: ${salaries[state.career]||0} FinCoins/month</p><p>Completed job-months: ${state.careerMonths||0}</p><div class="field"><label>Explore career stages</label><select id="careerExplore" onchange="inspectCareer(this.value)">${opts}</select></div>${next?`<p class="hint">Next: ${esc(next)} · Requires ${required} completed months in this career stage and ${fee} FinCoins qualification funds. Entrepreneur additionally requires 10,000 FinCoins startup capital.</p>${btn('Promote when eligible',`setCareer(${JSON.stringify(next)})`,'btn alt small')}`:'<p class="tag">Top career stage reached</p>'}</div><div><h3>📅 Month ${state.month}</h3><p class="muted">Salary: ${salaries[state.career]||0} FinCoins</p><div class="field"><label>Monthly expenses (FinCoins)</label><input id="expenses" type="number" min="0" max="10000" value="${state.monthExpense??30}" ${state.monthDone?'disabled':''}></div><div class="actions">${btn(state.monthDone?'Month completed ✓':'Complete month','finishMonth()')}${btn(state.decision?'Decision recorded ✓':'Make financial decision','worldDecision()','btn alt')}${btn('Next month →','nextMonth()','btn alt')}</div><p class="hint">Complete the month, make one decision, then advance. Each month can pay salary and award progress only once.</p></div></div>`)}<h2>🏦 Savings pocket</h2>${card(`<p>Wallet: ${state.coins} 🪙 · Savings: ${state.savings||0} 🪙</p>${btn('Choose deposit or withdrawal amount','savingsModal()','btn alt')}`)}<h2>📈 Virtual investment market</h2>${card(`<p>Invested holdings: ${Math.round(invested)} FinCoins. Values can rise or fall; selling returns the current simulated value.</p>${btn('Open investment choices','investModal()')}${state.investmentHistory?.length?investmentGraph(state.investmentHistory,'Portfolio value history'):''}`)}<h2>🛍️ Marketplace</h2>${card(`<p>Buy useful items or sell owned items. Purchases may lose resale value.</p>${btn('Open marketplace','marketModal()','btn alt')}`)}<h2>🧯 Emergency decision</h2>${card(`<p>Unexpected events give you choices. No coins are deducted until you choose an option.</p>${btn('Face an emergency scenario','emergency()','btn alt')}`)}<h2>🏢 Entrepreneur mode</h2>${card(`<p>${state.company?'Company: '+esc(state.business?.name||'Your business')+' · Value: '+Math.round(state.business?.value||0)+' 🪙':'Unlock Entrepreneur after career progression. Startup capital required: 10,000 FinCoins.'}</p>${btn(state.company?'Manage company':'Explore entrepreneur path','companyModal()')}`)}<h2>Your activity</h2>${card(state.history.length?state.history.slice(-8).reverse().map(h=>`<div class="lesson"><span>${esc(h)}</span></div>`).join(''):'<p class="muted">Your activity will appear here.</p>')}`;
};
inspectCareer=function(c){const i=careerPathV3.indexOf(c),idx=careerPathV3.indexOf(state.career),need=careerMonthsRequiredV3[c]||0,fee=careerFeesV3[c]||0;if(i===idx){return}if(i!==idx+1){modal(`<h2>Career stage locked</h2><p>Complete the stages in order. Your current role is ${esc(state.career)}.</p>`);render();return}modal(`<h2>${esc(c)}</h2><p>Status: ${(state.careerMonths||0)>=need&&state.coins>=fee&&!state.monthDone?'Requirements met':'Not unlocked yet'}</p><p>Required job-months: ${need} · Your experience: ${state.careerMonths||0}</p><p>Qualification funds: ${fee} 🪙 · Wallet: ${state.coins} 🪙</p>`);render();};
setCareer=function(c){const cur=careerPathV3.indexOf(state.career),tar=careerPathV3.indexOf(c),need=careerMonthsRequiredV3[c]||0,fee=careerFeesV3[c]||0;if(tar!==cur+1){modal('<h2>Career stage locked</h2><p>Career stages must be completed in order.</p>');return}if(state.monthDone&&!state.decision){modal('<h2>Finish this month first</h2><p>Record this month’s financial decision before promoting.</p>');return}if((state.careerMonths||0)<need){modal(`<h2>More experience needed</h2><p>${esc(c)} requires ${need} completed job-months in your current stage. You have ${state.careerMonths||0}.</p>`);return}if(state.coins<fee){modal(`<h2>Qualification funds needed</h2><p>${esc(c)} requires ${fee} FinCoins; your wallet has ${state.coins}.</p>`);return}if(c==='Entrepreneur'){if(state.coins<10000){modal(`<h2>Startup capital needed</h2><p>You need 10,000 FinCoins to enter Entrepreneur mode. Your wallet has ${state.coins} FinCoins.</p>`);return}state.career='Entrepreneur';state.careerMonths=0;state.monthDone=false;state.decision=false;state.history.push('Unlocked Entrepreneur career stage; 10,000 FinCoins remain available until company launch');save();modal('<h2>🚀 Entrepreneur unlocked</h2><p>You have entered Entrepreneur mode. Your 10,000 FinCoins startup capital has not been deducted yet. Open “Start a company”, choose a name and business type, then confirm launch to invest the 10,000 FinCoins once.</p>');return}state.coins-=fee;state.career=c;state.careerMonths=0;state.monthDone=false;state.decision=false;state.history.push(`Promoted to ${c}; qualification fee ${fee} FinCoins`);save();modal(`<h2>🎉 Promotion unlocked</h2><p>You are now a ${esc(c)}. Your job-month counter has restarted for this career stage.</p>`);};
finishMonth=function(){if(state.monthDone){modal('<h2>Month already completed</h2><p>Make your monthly decision, then advance. Salary cannot be collected twice.</p>');return}const e=num('expenses'),sal=salaries[state.career]||0;if(!Number.isFinite(e)||e<0||e>10000){modal('<h2>Check expenses</h2><p>Enter a valid expense amount.</p>');return}if(e>state.coins+sal){modal('<h2>Expenses exceed available funds</h2><p>Your wallet plus this month’s salary cannot cover that amount. Reduce planned expenses or choose a more affordable plan; the wallet will not go negative.</p>');return}state.monthExpense=e;state.coins+=sal-e;state.earned=(state.earned||0)+sal;state.spent=(state.spent||0)+e;state.monthDone=true;state.decision=false;state.monthsWorked=(state.monthsWorked||0)+1;state.careerMonths=(state.careerMonths||0)+1;state.history.push(`Month ${state.month}: salary +${sal}, expenses −${e}`);save();modal(`<h2>📅 Month ${state.month} completed</h2><p>Salary: +${sal} 🪙 · Expenses: −${e} 🪙</p><p><strong>Net change: ${sal-e>=0?'+':''}${sal-e} FinCoins</strong></p><p>Now make one financial decision to finish this month.</p>`);};
worldDecision=function(){if(!state.monthDone){modal('<h2>Complete the month first</h2><p>Record your salary and expenses before making the monthly decision.</p>');return}if(state.decision){modal('<h2>Decision already recorded</h2><p>You have completed this month’s decision. Advance to the next month to continue.</p>');return}const choices=[{id:'save',title:'Protect your emergency buffer',desc:'Move 20 FinCoins from wallet to savings if possible. This improves your safety net but reduces spendable cash.',cost:20},{id:'learn',title:'Invest in your skills',desc:'Spend 15 FinCoins on a learning resource. It costs money now but records a useful career habit.',cost:15},{id:'enjoy',title:'Choose a small reward',desc:'Spend 10 FinCoins on recreation. Enjoyment matters, but it reduces money available for goals.',cost:10}];modal(`<h2>🧠 Month ${state.month}: a real-life decision</h2><p>Your wallet: <strong>${state.coins} 🪙</strong> · Savings: <strong>${state.savings||0} 🪙</strong></p>${choices.map(c=>`<div class="decisionChoice"><strong>${c.title}</strong><p>${c.desc}</p><p class="hint">Cost: ${c.cost} FinCoins</p>${btn('Choose this option',`chooseDecisionV3('${c.id}')`,state.coins>=c.cost?'btn alt':'btn alt small')}</div>`).join('')}<p class="hint">Only one decision is recorded per month. The outcome affects your wallet, savings or career habits, not repeatable rewards.</p>`);};
chooseDecisionV3=function(id){if(!state.monthDone||state.decision){modal('<h2>Decision unavailable</h2><p>This month is not waiting for a decision.</p>');return}if(id==='save'){if(state.coins<20){modal('<h2>Not enough wallet funds</h2><p>You need 20 FinCoins available to make this transfer. Choose a different option.</p>');return}state.coins-=20;state.savings=(state.savings||0)+20;state.history.push(`Month ${state.month}: moved 20 FinCoins into savings to build an emergency buffer`)}else if(id==='learn'){if(state.coins<15){modal('<h2>Not enough wallet funds</h2><p>You cannot afford the learning resource this month. Choose a different option.</p>');return}state.coins-=15;state.spent=(state.spent||0)+15;state.history.push(`Month ${state.month}: spent 15 FinCoins on a learning resource`)}else if(id==='enjoy'){if(state.coins<10){modal('<h2>Not enough wallet funds</h2><p>You cannot afford this optional expense. Choose a different option.</p>');return}state.coins-=10;state.spent=(state.spent||0)+10;state.history.push(`Month ${state.month}: spent 10 FinCoins on recreation`)}else return;state.decision=true;save();modal(`<h2>Decision recorded ✓</h2><p>Your choice has been applied to Month ${state.month}. It cannot be repeated for extra coins.</p><p>Advance to Month ${state.month+1} when you are ready.</p>`);};
nextMonth=function(){if(!state.monthDone||!state.decision){modal('<h2>Finish the month first</h2><p>You must complete the monthly budget and record one financial decision before advancing. This prevents skipping and duplicate rewards.</p>');return}state.month++;state.monthDone=false;state.decision=false;state.history.push(`Started Month ${state.month}`);save();};
savingsModal=function(){modal(`<h2>🏦 Savings pocket</h2><p>Wallet: <strong>${state.coins} 🪙</strong> · Savings: <strong>${state.savings||0} 🪙</strong></p><div class="field"><label>Amount (FinCoins)</label><input id="savingsAmount" type="number" min="1" step="1" placeholder="Enter amount"></div><p class="hint">No deposit is preselected. Enter the amount you choose to move.</p><div class="actions">${btn('Deposit chosen amount','depositSavings()')}${btn('Withdraw chosen amount','withdrawSavings()','btn alt')}</div>`);};
/* Responsive alignment and clean lesson/quest presentation */
const v3Style=document.createElement('style');v3Style.textContent=`.footer{display:none!important}.learnHero{margin-bottom:18px}.learnHero h1{font-size:clamp(28px,4vw,40px)}.quizIntro{margin-bottom:20px;background:linear-gradient(115deg,#111f30,#123b4b);border-color:#315d6a}.quizIntro h2{margin:0 0 8px}.quizRewards{display:flex;flex-wrap:wrap;gap:10px 22px;font-weight:750}.quizRewards .perfect{color:#ffd47b;flex-basis:100%}.lessonTitle{min-width:0}.lessonTitle small{display:block;margin-top:3px}.lessonDefinition{white-space:normal;line-height:1.75}.levelProgress{max-width:420px;margin-top:22px;padding:12px 14px;background:#071b29aa;border:1px solid #37616b;border-radius:13px}.levelRow{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;color:#d8fff0}.quest{padding:15px 0}.questHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}.questBottom{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px}.questBottom small{flex:1 1 220px;color:#d6e4ec}.questBottom .btn{flex:0 0 auto;white-space:nowrap}.decisionChoice{border:1px solid var(--line);border-radius:13px;padding:13px;margin:12px 0;background:#0b1b29}.decisionChoice p{margin:5px 0}.lesson{align-items:center}.lesson .btn{flex-shrink:0}@media(max-width:500px){.questBottom{align-items:stretch}.questBottom small{flex-basis:100%}.questBottom .btn{width:100%}.lesson{align-items:flex-start}.lesson .btn{white-space:nowrap}.quizRewards{display:grid;gap:7px}}`;
document.head.appendChild(v3Style);
render();

</script>

      console.warn("FinGrow offline setup could not be registered:", error);
    });
  });
}
</script>
